[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abap-adt-cli"
version = "0.1.0"
description = "Fast, parallel ABAP development from the command line, built directly on the SAP ADT REST API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=25.0",
]

[project.scripts]
abap = "adt_cli.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/adt_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
